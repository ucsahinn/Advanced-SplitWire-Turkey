name: Doğrulama

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogrulama-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows doğrulama (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: .NET kur
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          global-json-file: global.json

      - name: Gitleaks kur
        shell: pwsh
        run: |
          $version = '8.30.1'
          $expectedSha256 = 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks-$version.zip"
          $toolDirectory = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          Invoke-WebRequest `
            -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" `
            -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Gitleaks arsiv SHA-256 dogrulamasi basarisiz."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Test, güvenlik taraması ve portable Windows x64 paketi üret
        shell: pwsh
        run: |
          try {
            ./scripts/build-release.ps1 -RequireGitleaks
          }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Astral CI::$message"
            throw
          }

      - name: Uygulama paketini yükle
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Astral-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
          retention-days: 14
